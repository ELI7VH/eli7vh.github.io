<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radio</title>
<style>
  html, body { margin: 0; height: 100%; background: rgb(20 25 32); overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #pop {
    position: fixed; top: 12px; right: 12px;
    padding: 6px 10px; border: 0; border-radius: 0;
    background: rgb(25 31 40); color: rgb(242 242 242 / 0.7);
    font: 14px/1 ui-monospace, Consolas, monospace; cursor: pointer;
  }
  #pop:hover { color: rgb(242 242 242); }
  .popped #pop { display: none; }
</style>
</head>
<body>
<iframe src="https://relay.elijahlucian.ca/radio/listen" allow="autoplay" title="radio"></iframe>
<button id="pop" type="button" aria-label="pop out">pop out ⧉</button>
<script>
  // a window of its own, sized to the panel: just the radio
  const W = 860, H = 160
  if (window.name === 'radio') document.body.classList.add('popped')
  document.getElementById('pop').addEventListener('click', () => {
    const left = Math.max(0, screen.availWidth - W - 24)
    const win = window.open(location.href, 'radio', `popup,width=${W},height=${H},left=${left},top=24`)
    if (win) { win.focus(); document.querySelector('iframe').src = 'about:blank' }
  })
</script>
</body>
</html>
